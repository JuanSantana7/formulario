<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">
    <h1>INSCRIÇÃO EM <BR/> <strong>CAMPEONATO</strong></h1>

    <p>Preecha os dados abaixo para se inscrever no nosso compeonato <br/> e mostre do que você é capaz </p>


    <form>

    <div class="form-control">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" >
    </div>

    <div class="form-control">
        <label for="email">E-mail:</label>
        <input type="email" id="email">
    </div>

    <div class="form-control">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" >
    </div>

    <div class="form-control">
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data">
    </div>

    <div class="form-control">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" >
    </div>

    <div class="form-control">
        <label for="jogo">Escolha seu jogo:</label>
        <select id="jogo">
            <option value="">Selecione</option>
            <option value="minecraft">Minecraft</option>
            <option value="fortnite">Fortnite</option>
            <option value="gta">GTA V</option>
            <option value="valorant">Valorant</option>

        </select>
    </div>

    <div class="form-control">
      <button type="submit" class="inscrever"> Inscrever-se</button>
      <button type="reset" class="limpar">Limpar</button>
    </div>


    </form>


    </div>

</body>
</html>
